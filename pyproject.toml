[project]
name = "principle-viz"
version = "0.3.0"
description = "Principles of Economics toolkit for demand/supply analytics and diagrams."
readme = "README.md"
authors = [{ name = "Anthony Sung", email = "sungpinyue@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
keywords = ["economics", "microeconomics", "demand", "supply", "equilibrium", "welfare", "tax"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mosaickit>=0.1.0,<0.2.0",
]

[project.scripts]
principle-viz = "principle_viz.cli.main:main"

[project.urls]
Homepage = "https://github.com/EconViz/principle-viz"
Repository = "https://github.com/EconViz/principle-viz"
Documentation = "https://github.com/EconViz/principle-viz"
Changelog = "https://github.com/EconViz/principle-viz/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "principle_viz"
module-root = "src"

[dependency-groups]
dev = ["pytest>=8.0.0,<9.0.0", "pytest-cov>=5.0.0,<6.0.0", "ruff>=0.5.0,<1.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--maxfail=1 --disable-warnings -q"

[tool.coverage.run]
source = ["principle_viz"]

[tool.coverage.report]
show_missing = true
skip_covered = false
